services:
  db:
    image: postgis/postgis:17-3.5
    container_name: llm-gis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-gis}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    container_name: llm-gis-agent
    depends_on:
      db:
        condition: service_healthy
    # Run as the invoking user so files written to the bind mounts are owned
    # by them, not root. Defaults suit the common single-user Linux case.
    user: "${LLM_GIS_UID:-1000}:${LLM_GIS_GID:-1000}"
    working_dir: /workspace
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gis}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@db:5432/${POSTGRES_DB:-gis}
      TMPDIR: /data/work/tmp
      # Keep the container venv off the bind-mounted host .venv: the container
      # runs as root, so a shared venv leaves root-owned files on the host.
      UV_PROJECT_ENVIRONMENT: /opt/llm-gis/venv
      # An arbitrary uid has no home directory in the image.
      HOME: /tmp
      GDAL_CACHEMAX: "256"
    volumes:
      - ./:/workspace:rw
      - ./data/incoming:/data/incoming:ro
      - ./data/outgoing:/data/outgoing:rw
      - ./data/work:/data/work:rw
      - agentvenv:/opt/llm-gis/venv
      - agentcache:/opt/llm-gis/cache
    entrypoint: ["/usr/local/bin/agent-entrypoint.sh"]
    command: ["sleep", "infinity"]

volumes:
  pgdata:
  agentvenv:
  agentcache:
