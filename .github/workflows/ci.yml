name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the agent image
        run: docker compose build agent

      - name: Offline suite
        run: bin/test

      - name: Live suite against PostGIS
        run: |
          docker compose up -d db
          bin/test -m live

      # Runners are uid 1001, so this fails if the container ever reverts to
      # running as root or to a hardcoded uid. Goes through bin/_env.sh, the
      # same path the bin/* wrappers use.
      - name: Output must be owned by the caller, never root
        run: |
          source bin/_env.sh
          docker compose run --rm agent touch /data/outgoing/_ci_uid_check
          test "$(stat -c '%u' data/outgoing/_ci_uid_check)" = "$(id -u)"
          rm -f data/outgoing/_ci_uid_check
