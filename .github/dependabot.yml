version: 2

updates:
  # Python dependencies in pyproject.toml / uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security fixes travel alone and land fast.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Routine version bumps arrive as one reviewable PR per week.
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GDAL base image for the agent container.
  - package-ecosystem: docker
    directory: /docker/agent
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
