[project]
name = "llm-gis"
version = "0.1.0"
description = "Headless geospatial ingestion and analysis backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "typer>=0.12.0",
]

[project.scripts]
llm-gis = "llm_gis.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
